<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Finish Videos</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
    position:relative;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
    color:#ccc;
}

/* PLUS BUTTON */

.plus-button{
    position:absolute;
    right:15px;
    top:15px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#ff9800;
    color:white;
    font-size:30px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
}

.plus-button:hover{
    transform:scale(1.05);
}

/* SEARCH */

.search{
    padding:15px;
    text-align:center;
    background:white;
}

.search input{
    width:90%;
    max-width:600px;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

/* FILTERS */

.filters{
    text-align:center;
    padding:15px;
}

.filters button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:#ddd;
    font-size:15px;
}

.filters button.active{
    background:#111;
    color:white;
}

/* CONTENT */

#content{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:auto;
    display:block;
}

.card video{
    width:100%;
    display:block;
    background:#000;
}

.card-info{
    padding:15px;
}

.card-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.card-description{
    color:#666;
    line-height:1.5;
}

.card-type{
    font-size:13px;
    color:#999;
    margin-top:8px;
}

.delete-button{
    background:#e53935;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    margin-top:12px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:50px;
    color:#777;
    grid-column:1/-1;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.65);
    overflow:auto;
}

.modal-box{
    background:white;
    width:90%;
    max-width:500px;
    margin:60px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.modal-box h2{
    margin-top:0;
    text-align:center;
}

.close-button{
    float:right;
    border:none;
    background:none;
    font-size:28px;
    cursor:pointer;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.upload-button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#4caf50;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.upload-button:disabled{
    background:#999;
    cursor:not-allowed;
}

.progress-container{
    display:none;
    margin-top:15px;
}

.progress-bar-background{
    width:100%;
    height:12px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#4caf50;
}

.progress-text{
    text-align:center;
    margin-top:5px;
    font-size:14px;
}

.file-info{
    margin-top:8px;
    font-size:13px;
    color:#666;
}

</style>

</head>

<body>


<header>

<button
    class="plus-button"
    onclick="openAdmin()"
>
+
</button>

<h1>🎬 Finish Videos</h1>

<p>Videos & Images</p>

</header>


<div class="search">

<input
    id="searchInput"
    type="text"
    placeholder="🔎 Search..."
    oninput="displayContent()"
>

</div>


<div class="filters">

<button
    class="active"
    onclick="setFilter('all',this)"
>
All
</button>

<button
    onclick="setFilter('video',this)"
>
🎬 Videos
</button>

<button
    onclick="setFilter('image',this)"
>
🖼️ Images
</button>

</div>


<div id="content">

<div class="empty">
Loading...
</div>

</div>


<!-- ADMIN PASSWORD MODAL -->

<div id="passwordModal" class="modal">

<div class="modal-box">

<button
    class="close-button"
    onclick="closePasswordModal()"
>
×
</button>

<h2>🔐 Admin Access</h2>

<div class="form-group">

<label>Password</label>

<input
    id="adminPassword"
    type="password"
    placeholder="Enter password"
>

</div>

<button
    class="upload-button"
    onclick="checkPassword()"
>
Continue
</button>

</div>

</div>


<!-- ADD CONTENT MODAL -->

<div id="addModal" class="modal">

<div class="modal-box">

<button
    class="close-button"
    onclick="closeAddModal()"
>
×
</button>

<h2>➕ Add Content</h2>


<div class="form-group">

<label>Content Type</label>

<select id="contentType" onchange="changeContentType()">

<option value="image">
🖼️ Image
</option>

<option value="video">
🎬 Video
</option>

</select>

</div>


<div class="form-group">

<label>Title</label>

<input
    id="contentTitle"
    type="text"
    placeholder="Enter title"
>

</div>


<div class="form-group">

<label>Description</label>

<textarea
    id="contentDescription"
    placeholder="Enter description"
></textarea>

</div>


<div class="form-group">

<label>Select File</label>

<input
    id="contentFile"
    type="file"
    accept="image/*"
>

<div
    id="fileInfo"
    class="file-info"
>
No file selected
</div>

</div>


<button
    id="uploadButton"
    class="upload-button"
    onclick="uploadContent()"
>
⬆️ Upload
</button>


<div
    id="progressContainer"
    class="progress-container"
>

<div class="progress-bar-background">

<div
    id="progressBar"
    class="progress-bar"
></div>

</div>

<div
    id="progressText"
    class="progress-text"
>
0%
</div>

</div>


</div>

</div>


<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getDatabase,
    ref,
    onValue,
    push,
    remove

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {

    getStorage,
    ref as storageRef,
    uploadBytesResumable,
    getDownloadURL,
    deleteObject

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyB7y5ePaBA1uSOAWzIWw1OVXKGp3Bkfbfw",

    authDomain:
    "finish-app-e69cd.firebaseapp.com",

    databaseURL:
    "https://finish-app-e69cd-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "finish-app-e69cd",

    storageBucket:
    "finish-app-e69cd.firebasestorage.app",

    messagingSenderId:
    "959903200634",

    appId:
    "1:959903200634:web:4ded7b54da72b08e3a52c3"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const storage = getStorage(app);


const contentRef =
ref(db,"content");


let allContent = [];

let currentFilter = "all";


/* PASSWORD */

window.openAdmin = function(){

    document.getElementById("passwordModal").style.display="block";

};


window.closePasswordModal = function(){

    document.getElementById("passwordModal").style.display="none";

};


window.checkPassword = function(){

    const password =
    document.getElementById("adminPassword").value;


    if(password === "sla100"){

        document.getElementById("passwordModal").style.display="none";

        document.getElementById("addModal").style.display="block";

        document.getElementById("adminPassword").value="";

    }else{

        alert("❌ Wrong password");

    }

};


/* CLOSE ADD MODAL */

window.closeAddModal = function(){

    document.getElementById("addModal").style.display="none";

};


/* CHANGE IMAGE / VIDEO */

window.changeContentType = function(){

    const type =
    document.getElementById("contentType").value;

    const fileInput =
    document.getElementById("contentFile");


    if(type === "image"){

        fileInput.accept="image/*";

    }else{

        fileInput.accept="video/*";

    }

    fileInput.value="";

    document.getElementById("fileInfo").innerText=
    "No file selected";

};


/* FILE INFORMATION */

document
.getElementById("contentFile")
.addEventListener("change",function(){

    const file=this.files[0];

    if(!file){

        document.getElementById("fileInfo").innerText=
        "No file selected";

        return;

    }

    const sizeMB =
    (file.size / (1024 * 1024)).toFixed(2);

    document.getElementById("fileInfo").innerText=
    file.name + " — " + sizeMB + " MB";

});


/* UPLOAD */

window.uploadContent = function(){

    const type =
    document.getElementById("contentType").value;


    const title =
    document.getElementById("contentTitle").value.trim();


    const description =
    document.getElementById("contentDescription").value.trim();


    const file =
    document.getElementById("contentFile").files[0];


    if(title === ""){

        alert("❌ Please enter a title");

        return;

    }


    if(!file){

        alert("❌ Please select a file");

        return;

    }


    /* CHECK FILE TYPE */

    if(type === "image" &&
       !file.type.startsWith("image/")){

        alert("❌ Please select an image");

        return;

    }


    if(type === "video" &&
       !file.type.startsWith("video/")){

        alert("❌ Please select a video");

        return;

    }


    const button =
    document.getElementById("uploadButton");


    button.disabled=true;

    button.innerText="Uploading...";


    document
    .getElementById("progressContainer")
    .style.display="block";


    const fileName =
    Date.now() + "_" +
    file.name.replace(/[^a-zA-Z0-9._-]/g,"_");


    const filePath =
    type + "s/" + fileName;


    const fileRef =
    storageRef(storage,filePath);


    const uploadTask =
    uploadBytesResumable(fileRef,file);


    uploadTask.on(

        "state_changed",

        (snapshot)=>{

            const progress =
            (snapshot.bytesTransferred /
             snapshot.totalBytes) * 100;


            document
            .getElementById("progressBar")
            .style.width =
            progress + "%";


            document
            .getElementById("progressText")
            .innerText =
            Math.round(progress) + "%";

        },


        (error)=>{

            console.error(error);

            alert(
                "❌ Upload failed: " +
                error.message
            );


            button.disabled=false;

            button.innerText="⬆️ Upload";

        },


        async ()=>{

            try{

                const downloadURL =
                await getDownloadURL(
                    uploadTask.snapshot.ref
                );


                await push(
                    contentRef,
                    {

                        type:type,

                        title:title,

                        description:description,

                        fileUrl:downloadURL,

                        filePath:filePath,

                        fileName:file.name,

                        createdAt:Date.now()

                    }
                );


                alert("✅ Content uploaded successfully!");


                document
                .getElementById("contentTitle")
                .value="";


                document
                .getElementById("contentDescription")
                .value="";


                document
                .getElementById("contentFile")
                .value="";


                document
                .getElementById("fileInfo")
                .innerText=
                "No file selected";


                document
                .getElementById("progressContainer")
                .style.display="none";


                document
                .getElementById("progressBar")
                .style.width="0%";


                button.disabled=false;

                button.innerText="⬆️ Upload";


                closeAddModal();


            }catch(error){

                console.error(error);

                alert(
                    "❌ Could not save content: " +
                    error.message
                );

                button.disabled=false;

                button.innerText="⬆️ Upload";

            }

        }

    );

};


/* READ CONTENT */

onValue(

    contentRef,

    (snapshot)=>{

        const data=snapshot.val();


        if(!data){

            allContent=[];

        }else{

            allContent =
            Object.entries(data)
            .map(([id,item])=>({

                id:id,

                ...item

            }));

        }


        displayContent();

    }

);


/* FILTER */

window.setFilter=function(filter,button){

    currentFilter=filter;


    document
    .querySelectorAll(".filters button")
    .forEach(btn=>{

        btn.classList.remove("active");

    });


    button.classList.add("active");


    displayContent();

};


/* DISPLAY */

window.displayContent=function(){

    const container =
    document.getElementById("content");


    const search =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase();


    let items =
    allContent.filter(item=>{

        const matchesFilter =
        currentFilter === "all" ||
        item.type === currentFilter;


        const matchesSearch =
        (item.title || "")
        .toLowerCase()
        .includes(search);


        return matchesFilter &&
               matchesSearch;

    });


    container.innerHTML="";


    if(items.length===0){

        container.innerHTML=`

        <div class="empty">

            No content yet.

        </div>

        `;

        return;

    }


    items.sort(
        (a,b)=>
        (b.createdAt || 0) -
        (a.createdAt || 0)
    );


    items.forEach(item=>{

        let media="";


        if(item.type === "image"){

            media=`

            <img
                src="${item.fileUrl}"
                alt="${item.title || ""}"
            >

            `;

        }


        if(item.type === "video"){

            media=`

            <video
                controls
                preload="metadata"
            >

                <source
                    src="${item.fileUrl}"
                    type="video/mp4"
                >

                Your browser does not support video.

            </video>

            `;

        }


        container.innerHTML +=`

        <div class="card">

            ${media}

            <div class="card-info">

                <div class="card-title">

                    ${item.title || ""}

                </div>


                <div class="card-description">

                    ${item.description || ""}

                </div>


                <div class="card-type">

                    ${
                        item.type === "video"
                        ? "🎬 Video"
                        : "🖼️ Image"
                    }

                </div>


                <button
                    class="delete-button"
                    onclick="deleteContent(
                        '${item.id}',
                        '${encodeURIComponent(item.filePath || "")}'
                    )"
                >

                    🗑️ Delete

                </button>

            </div>

        </div>

        `;

    });

};


/* DELETE */

window.deleteContent =
async function(id,encodedPath){

    const confirmed =
    confirm(
        "Are you sure you want to delete this content?"
    );


    if(!confirmed) return;


    try{

        const filePath =
        decodeURIComponent(encodedPath);


        if(filePath){

            const fileRef =
            storageRef(storage,filePath);

            await deleteObject(fileRef);

        }


        await remove(
            ref(db,"content/" + id)
        );


        alert("✅ Content deleted");


    }catch(error){

        console.error(error);

        alert(
            "❌ Delete failed: " +
            error.message
        );

    }

};

</script>

</body>

</html>
